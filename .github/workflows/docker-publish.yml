name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'identity-service/**'   # à retirer si le repo ne contient QUE identity-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./identity-service   # à ajuster selon ton arborescence
          push: true
          tags: |
            digitalmaith/identity-service:latest
            digitalmaith/identity-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max